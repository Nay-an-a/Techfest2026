[build]
  command = "npm run build"
  publish = "dist"

# Proxy API calls to Render so the auth cookie stays same-site. Replace with your Render URL.
[[redirects]]
  from = "/api/*"
  to = "https://techfest2026-6mqv.onrender.com/api/:splat"
  status = 200
  force = true

# React Router: serve index.html for every page so refreshes work
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
